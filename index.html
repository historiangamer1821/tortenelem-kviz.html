<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Történelem-kvíz – 7. osztály</title>
<style>
:root{--bg:#faf6ee;--cd:#fff;--tx:#2b2418;--mu:#6d634f;--ac:#8a5a00;--ok:#d7f0de;--no:#f6d5d1;--bd:#e3d8c0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1912;--cd:#2a251a;--tx:#f3ecdc;--mu:#b8ad94;--ac:#e8b54a;--ok:#1f4a2c;--no:#5a2520;--bd:#42392a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1912;--cd:#2a251a;--tx:#f3ecdc;--mu:#b8ad94;--ac:#e8b54a;--ok:#1f4a2c;--no:#5a2520;--bd:#42392a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:clamp(16px,2.2vw,20px)/1.45 system-ui,Segoe UI,Arial,sans-serif}
#app{max-width:760px;margin:0 auto;padding:16px}
h1{color:var(--ac);margin:.3em 0 0}h2{margin:.2em 0 .6em;font-size:1.2em}h3{margin:1em 0 .4em}
.mu{color:var(--mu)}.g{color:#2f8f4e;font-weight:700}.r{color:#c0392b;font-weight:700}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px}
.b{display:block;width:100%;text-align:left;margin:6px 0;padding:12px 14px;font:inherit;color:var(--tx);background:var(--cd);border:2px solid var(--bd);border-radius:10px;cursor:pointer}
.b:hover:not(:disabled){border-color:var(--ac)}.b.on{border-color:var(--ac);background:var(--ok)}
.b.go{background:var(--ac);color:#fff;text-align:center;font-weight:700;border-color:var(--ac)}
.opt:disabled{opacity:1;cursor:default}.opt.ok{background:var(--ok);border-color:#2f8f4e}.opt.no{background:var(--no);border-color:#c0392b}
.row{display:flex;flex-wrap:wrap;gap:8px}.row .b{width:auto;flex:1;text-align:center}
input{font:inherit;padding:10px;margin:4px 6px 4px 0;border:3px solid;border-radius:8px;background:var(--cd);color:var(--tx);width:calc(50% - 12px);box-sizing:border-box}
.sb{display:flex;gap:6px;margin-bottom:12px}.sb div{flex:1;padding:6px 8px;border-radius:10px;background:var(--cd);border:2px solid var(--bd);text-align:center;font-size:.85em}
.sb .act{border-width:3px;font-weight:700;transform:scale(1.04)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;width:100%;background:var(--ac)}
img{display:block;max-width:100%;max-height:300px;margin:0 auto 12px;border-radius:10px}.sb{justify-content:space-between}.sb div{border:0;background:none;font-size:1em}
</style></head><body><div id="app"></div>
<script>
const Q=[
[1,"Mit állított szembe a nacionalizmus a széttagolt, feudális királyságokkal?","A nemzet területi egységét, az egységes nemzetállam igényét",["A vallási egységet","A királyok korlátlan hatalmát","A vámok emelését"],"A közös nyelv és kultúra mellett gazdasági érdek is volt: egységes vasút, pénzrendszer, vámmentesség."],
[1,"Melyik állam vezetésével valósult meg az olasz egység?","Piemont",["Szicília","A Pápai Állam","A Nápolyi Királyság"],"Piemont volt az észak-itáliai rész legerősebb állama."],
[1,"Hol győzött Piemont francia segítséggel az osztrákok felett 1859-ben?","Solferinónál",["Königgrätznél","Sumternél","Versailles-ban"],"E véres csata tapasztalatai után alapították a Nemzetközi Vöröskeresztet."],
[1,"Hány emberrel szállt partra Garibaldi Szicíliában?","Kb. ezer vörösinges önkéntessel",["Százezer katonával","Tízezer lovassal","Száz tengerésszel"],"Útközben népfelkelők csatlakoztak hozzá, és megdöntötte a Bourbonok uralmát.","battle"],
[1,"Mikor kiáltották ki Torinóban az egységes Olasz Királyságot?","1861-ben",["1848-ban","1866-ban","1871-ben"],"Róma csatlakozásával 1870-ben teljesedett ki az egység."],
[1,"Mit mondott Bismarck, a „vaskancellár” a kor nagy kérdéseiről?","Nem beszédekkel, hanem vassal és vérrel döntik el őket",["A parlament dönti el őket","Békés tárgyalással rendezhetők","A pápa dönti el őket"],"Bismarck háborúval döntötte el Poroszország és Ausztria vetélkedését."],
[1,"Minek köszönhette Poroszország a königgrätzi győzelmet 1866-ban?","A vasút hadi használatának és a hátultöltős puskának",["A nagyobb lovasságnak","Francia segítségnek","A flottának"],"A poroszok ötször tudtak tüzelni, amíg az osztrákok egyszer.","cannon"],
[1,"Ki és hol hirdette ki a Német Császárságot 1871 januárjában?","I. Vilmos porosz király a versailles-i palotában",["III. Napóleon Párizsban","Bismarck Berlinben","Ferenc József Bécsben"],"Franciaország elvesztette Elzászt és Lotaringiát, és jóvátételt fizetett."],
[2,"Mit jelentett a „Go West!” jelszó?","Az USA terjeszkedését a Csendes-óceánig",["A kivándorlást Európába","A rabszolgák szökését Kanadába","A vámok bevezetését"],"A terjeszkedés az indiánoknak végzetes volt: háromnegyedük elpusztult."],
[2,"Mi jellemezte a déli államok gazdaságát?","Rabszolgákkal művelt ültetvények (gyapot, rizs, dohány)",["Textilgyárak és vasutak","Farmergazdaságok és nehézipar","Manufaktúrák és céhek"],"Északon az ipar és a farmergazdaságok fejlődtek."],
[2,"Mi volt az Észak és Dél közötti ellenségeskedés fő oka?","A rabszolgatartás kérdése",["A pénzrendszer","Az indiánkérdés","A távolság"],"A gazdasági ok a vámvita volt: Észak védővámot, Dél szabad kereskedelmet akart."],
[2,"Mi történt Lincoln 1860-as megválasztása után?","11 déli állam kilépett, és megalakította a Konföderációt",["Az északi államok kiléptek","Kitört az indiánháború","Anglia megtámadta az USA-t"],"Az Unióban 23 tagállam maradt; 1861-ben kezdődött a polgárháború."],
[2,"Mi volt a polgárháború fordulópontja?","Lincoln kihirdette a rabszolgák felszabadítását a lázadó államokban is",["Anglia belépett a háborúba","Lee tábornok meghalt","Észak megvette Délt"],"A felszabadultak tömegesen szöktek északra, és beálltak a hadseregbe."],
[2,"Mi lett a polgárháború eredménye?","Megszűnt a rabszolgaság, megszilárdult az egység, az USA nagyhatalommá vált",["Az USA két országra szakadt","A rabszolgaság megmaradt délen","Anglia visszaszerezte a területeket"],"A háború 1861–1865 között zajlott."],
[3,"Miért nevezték Angliát „a világ műhelyének”?","Itt zajlott az ipari forradalom, a világ nyersvastermelésének felét adta",["Nem volt gyarmata","A mezőgazdaság volt a vezető ágazat","Itt gyártották a legtöbb autót"],"A lakosság fele az iparból élt."],
[3,"Mi volt az 1851-es londoni világkiállítás jelképe?","A Kristálypalota",["Az Eiffel-torony","A Big Ben","A Tower Bridge"],"Az 540 méter hosszú, üveggel borított acélvázas épület a kor modern technikáját mutatta."],
[3,"Mi lett a gyarmatosítás fő formája a XIX. században?","A tőkekivitel",["Az új területek kifosztása","A rabszolgakereskedelem","Az aranyszállítás"],"A vállalkozók ültetvényeket, bányákat létesítettek, mert a gyarmatokon olcsó volt a munkaerő."],
[3,"Mi váltotta ki közvetlenül az 1857-es szipojfelkelést?","A disznózsírral vagy marhafaggyúval kent töltények, amelyeket a katonák vallása tiltott",["Az adók emelése","Viktória megkoronázása","A vasútépítés"],"A fő ok az angol gyarmatosítás volt; a töltények csak az „utolsó csepp a pohárban”."],
[3,"Mi lett India sorsa a felkelés leverése után?","Angol alkirályság lett, Viktória India császárnője",["Független állam lett","Francia gyarmat lett","Kis királyságokra szakadt"],"Indiát „a brit korona legszebb gyémántjának” nevezték."],
[3,"Mit ért el a brit munkásmozgalom békés eszközökkel?","8 órás munkaidőt, öregségi nyugdíjat, betegbiztosítást",["A köztársaságot","A gyarmatok felszabadítását","A rabszolgaság eltörlését"],"Viktóriát halálakor „Európa nagymamájaként” tisztelték."],
[4,"Mi indította el a második ipari forradalmat?","Az elektromosság alkalmazása",["A gőzgép feltalálása","A vasútépítés","A gyarmatosítás"],"A szabad versenyes kapitalizmusban fontossá vált az új találmányok felhasználása."],
[4,"Ki találta fel a vezetékes telefont, és ki a telefonközpontot?","Bell skót fizikus; Puskás Tivadar",["Edison; Bell","Puskás Tivadar; Bell","Bell; Edison"],"Telefonközpontot elsőként Párizsban építettek.","phone"],
[4,"Mikorra és minek az évfordulójára készült el az Eiffel-torony?","1889-re, a francia forradalom századik évfordulójára",["1851-re, a londoni világkiállításra","1871-re, a Német Császárság kikiáltására","1865-re, a polgárháború végére"],"A párizsi világkiállításra épült, 12 ezer acéldarabból.","eiffel"],
[1,"Ki látható a képen?","Giuseppe Garibaldi",["Otto von Bismarck","Abraham Lincoln","Thomas Edison"],"Garibaldi a vörösingesek vezére volt, jellegzetes öltözékében látod.","garibaldi"],
[1,"Ki látható a képen, a porosz „vaskancellár”?","Otto von Bismarck",["Garibaldi","I. Vilmos","III. Napóleon"],"Bismarck háborúkkal (1866, 1870–71) egyesítette Németországot.","bismarck"],
[1,"Melyik eseményt ábrázolja a festmény?","A Német Császárság kikiáltását Versailles-ban",["A solferinói csatát","A párizsi kommün kikiáltását","Róma csatlakozását Olaszországhoz"],"1871 januárjában történt; a festő Bismarckot tette a kép középpontjába.","versailles"],
[2,"Mit csinál a férfi a képen?","Aranyat mos az aranyláz idején",["Gyapotot szed","Szenet bányászik","Halat fog"],"1848-ban Kaliforniában aranyat találtak; az aranyásókat kiszolgáló Levi Strauss a farmernadrágot találta ki.","gold"],
[2,"Ki áll a kép közepén, magas kalapban?","Abraham Lincoln",["George Washington","Robert Lee","Ulysses Grant"],"Lincoln az északiak elnöke volt a polgárháborúban (1861–1865).","lincoln"],
[2,"Mit mutat a térkép?","Észak és Dél erőviszonyait a polgárháború elején",["Az USA terjeszkedését nyugat felé","Az indiánok lakóterületeit","A vasúthálózatot"],"Északon 23 állam és 22 millió lakos, délen 11 állam és 9 millió lakos volt.","map"],
[3,"Melyik híres épületet látod?","A londoni Kristálypalotát",["Az Eiffel-tornyot","A versailles-i palotát","A Buckingham-palotát"],"Az 1851-es világkiállítás jelképe volt: üveggel borított acélvázas óriásépület.","crystal"],
[3,"Melyik eseményt ábrázolja a kép a delhi Vörös erődnél?","A szipojfelkelést (1857)",["A solferinói csatát","Az amerikai polgárháborút","A Német Császárság kikiáltását"],"Az angol hadsereg indiai katonái lázadtak fel a gyarmatosítók ellen.","sepoy"],
[3,"Kit ábrázol a portré, akit „Európa nagymamájának” neveztek?","Viktória angol királynőt",["Mária Teréziát","I. Erzsébetet","Sissit"],"Viktória (1837–1901) korát viktoriánus kornak hívják; 1876-tól India császárnője is volt.","victoria"],
[4,"Mi a neve ennek a készüléknek, amelyet Edison fejlesztett ki?","Fonográf",["Telefonközpont","Izzólámpa","Távíró"],"A hangok felvételére és lejátszására szolgált, a lemezjátszók őse.","phono"]
];

function home(){app.innerHTML=`<h1>🏛️ Történelem-kvíz</h1><p class=mu>7. osztály · tanulj játszva, képekkel</p><h3>Válassz témakört!</h3>${LN.map((t,i)=>`<button class="b ${i==C.l?"on":""}" onclick="C.l=${i};home()">${t}</button>`).join("")}<button class="b go" style="margin-top:16px" onclick="start()">Indulhat a játék ▶</button>`}
function start(){run(sh(Q.filter(q=>!C.l||q[0]==C.l)).slice(0,12),sh(TL.filter(t=>!C.l||t[0]==C.l)))}
function run(pool,tl,keep){const seq=[];pool.forEach((q,k)=>{seq.push({q});if((k+1)%4==0&&tl&&tl.length)seq.push({t:tl.shift()[1]})});S={seq,i:0,p:keep?S.p:0,s:0,miss:[],n:pool.length};turn()}
const hd=()=>`<div>Kérdés <b>${Math.min(S.i+1,S.seq.length)}/${S.seq.length}</b></div><div>⭐ <b>${S.p}</b> pont</div><div>🔥 <b>${S.s}</b></div>`;
function view(h){app.innerHTML=`<div class=sb>${hd()}</div><div class=bar><i style="width:${S.i/S.seq.length*100}%"></i></div>${h}`}
function turn(){if(S.i>=S.seq.length)return end();const it=S.seq[S.i];
if(it.q){const[,q,ok,w,ex,im]=it.q,o=sh([ok,...w]);S.c={o,ok,ex,q:it.q};
view(`<div class=card>${im?`<img src="${IM[im]}" alt="">`:""}<h2>${E(q)}</h2>${o.map((x,j)=>`<button class="b opt" onclick="ans(${j})">${E(x)}</button>`).join("")}<div id=fb></div></div>`)}
else{S.c={p:[],ev:it.t,r:sh([0,1,2,3])};tl()}}
function ans(j){const{o,ok,ex,q}=S.c,good=o[j]===ok;let pts=0;
document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=1;if(o[k]===ok)b.classList.add("ok");else if(k==j)b.classList.add("no")});
if(good){S.s++;pts=10+Math.min(S.s-1,3)*5;S.p+=pts}else{S.s=0;S.miss.push(q)}
$(".sb").innerHTML=hd();
$("#fb").innerHTML=`<p class=${good?"g":"r"}>${good?"✅ "+OK[Math.random()*5|0]+" +"+pts+" pont"+(S.s>1?" · 🔥 "+S.s+" egymás után":""):"❌ Nem baj, így tanulunk! A helyes válasz zölddel látszik."}</p><p class=mu>${E(ex)}</p><button class="b go" onclick="S.i++;turn()">Tovább ▶</button>`}
function tl(){const{p,ev,r}=S.c;
view(`<div class=card><h2>⏳ Időrend-kihívás</h2><p class=mu>Kattints az eseményekre időrendi sorrendben, a legkorábbitól! (+20 pont)</p>${r.map(k=>`<button class="b opt" ${p.includes(k)?"disabled":""} onclick="pk(${k})">${p.includes(k)?(p.indexOf(k)+1)+". ":""}${E(ev[k][1])}</button>`).join("")}<div id=fb></div><button class=b onclick="S.c.p=[];tl()">↺ Újrakezdés</button></div>`)}
function pk(k){const c=S.c;c.p.push(k);tl();if(c.p.length<4)return;
const good=c.p.every((x,i)=>x==i);if(good)S.p+=20;
document.querySelectorAll(".card .b").forEach(b=>b.disabled=1);$(".sb").innerHTML=hd();
$("#fb").innerHTML=`<p class=${good?"g":"r"}>${good?"✅ Tökéletes sorrend! +20 pont":"❌ Nem egészen. A helyes sorrend:"}</p><ol>${c.ev.map(e=>`<li><b>${e[0]}</b> – ${E(e[1])}</li>`).join("")}</ol><button class="b go" onclick="S.i++;turn()">Tovább ▶</button>`}
function end(){const g=S.n-S.miss.length,pc=g/S.n,st=pc>=.9?"🌟🌟🌟":pc>=.6?"🌟🌟":"🌟";
app.innerHTML=`<h1>${st} Vége a játéknak!</h1><div class=card><h2>${g} / ${S.n} jó válasz</h2><h2>⭐ ${S.p} pont</h2><p class=mu>${pc>=.9?"Kiváló vagy, remekül ismered a leckét!":pc>=.6?"Nagyon szép! Még egy kör, és profi leszel.":"Jó kezdet! Gyakorold újra a hibás kérdéseket."}</p></div>${S.miss.length?`<button class="b go" onclick="run(sh(S.miss),null,1)">🔁 A hibás kérdések újra (${S.miss.length})</button>`:""}<button class="b" onclick="start()">🎲 Új játék</button><button class="b" onclick="home()">🏠 Témakörök</button>`}
home();
</script></body></html>
